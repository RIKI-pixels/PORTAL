<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PORTAL CDI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/PORTAL/style/style.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="sidebar-top">

        <div class="logo" onclick="mostrarInicio()">
            <img src="CDI.png">
        </div>

        <div class="avatar">
            K
        </div>

    </div>

    <div class="menu">

        <div class="menu-item active" id="inicioBtn" onclick="mostrarInicio()">
            <div class="menu-icon">🏠</div>
            <div>Área Inicial</div>
        </div>

        <div class="menu-item" id="programacaoBtn" onclick="mostrarProgramacao()">
            <div class="menu-icon">🚛</div>
            <div>Programação</div>
        </div>

    </div>

</div>

<!-- MAIN -->

<div class="main">


    <div class="content">

        <!-- HOME -->

        <div class="box home-screen" id="inicio">

            <div class="watermark">
                <img src="LOGO.png">
            </div>

            <h1>PORTAL TRANSPORTE</h1>

            <p>
                Salamaleikon TESTE V0.4   
            </p>

        </div>

<!-- HOME -->

<div class="box home-screen" id="inicio">

    <h1>PORTAL CDI</h1>

    <p class="versao">
        Versão 1.0 BETA TEST
    </p>

    <div class="dashboard">

        <div class="status-card">

            <h3>🚛 TSV TRANSPORTE</h3>

            <div class="status-item">
                <span>Última atualização</span>
                <strong id="dataTransporte">
                    00/00/0000 00:00
                </strong>
            </div>

            <div class="status-item">
                <span>Registros carregados</span>
                <strong id="linhasTransporte">
                    0000
                </strong>
            </div>

        </div>

        <div class="status-card">

            <h3>📦 TSV ESTOQUE</h3>

            <div class="status-item">
                <span>Última atualização</span>
                <strong id="dataEstoque">
                    00/00/0000 00:00
                </strong>
            </div>

            <div class="status-item">
                <span>Registros carregados</span>
                <strong id="linhasEstoque">
                    0000
                </strong>
            </div>

        </div>

    </div>

</div>
 <script src="/PORTAL/javascript/index.js"></script>

</html>
